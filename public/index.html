<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GGST Profile</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <h1>GGST Profile</h1>
    <div class="card">
        <div class="form-row">
            <input type="text" id="name" placeholder="Enter your name..." autofocus>
            <button id="create">Create</button>
        </div>
        <div id="result">
            <div class="placeholder">Generating...</div>
        </div>
        <div id="share">
            <button id="download">Download SVG</button>
            <a href="https://github.com/New9c/ggst_profile" target="_blank" rel="noopener noreferrer">
                GitHub
            </a>
        </div>
        <script src="/profile.js"></script>
</body>

</html>
